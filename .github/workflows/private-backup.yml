name: Private launch database backup
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: vars.MAZRAATY_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-new
    defaults:
      run:
        working-directory: website/app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      BACKUP_CONFIG: wrangler.deploy.jsonc
      BACKUP_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run cf:configure
      - run: bun scripts/backup-d1.mjs
      # Private R2 object only. Never upload customer SQL to Actions artifacts.
