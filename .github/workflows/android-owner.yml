name: Build Cloudflare Android owner APK
on:
  push:
    branches: ['codex/**', main]
    paths: ['android/owner/**', '.github/workflows/android-owner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android 35 toolchain
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platforms;android-35'
      - name: Build and verify signed test APK
        run: bash android/owner/build.sh
      - name: Verify Cloudflare address in compiled APK
        run: |
          unzip -p android/owner/build/Mazraaty-Owner-test.apk classes.dex > /tmp/mazraaty-owner.dex
          strings /tmp/mazraaty-owner.dex > /tmp/mazraaty-owner-strings.txt
          grep -F 'mazraati-preview.laithlaith500.workers.dev' /tmp/mazraaty-owner-strings.txt
          if grep -F 'mazraaty-iraq.higgsfield.app' /tmp/mazraaty-owner-strings.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mazraaty-Owner-Cloudflare-test
          path: android/owner/build/Mazraaty-Owner-test.apk
          if-no-files-found: error
          retention-days: 14
