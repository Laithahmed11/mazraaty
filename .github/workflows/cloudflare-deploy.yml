name: Deploy independent Cloudflare Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-mazraati
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/app
    env:
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: node scripts/check-image-tooling.mjs
      - run: bun run audit:security
      - run: bun run typecheck
      - run: bun run test:product
      - run: bun run build
      - run: bun run db:local
      - run: bun run cf:dry-run
      - run: bun run test:worker
      - uses: actions/upload-artifact@v4
        with:
          name: validated-worker
          path: website/app/dist
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-new
    defaults:
      run:
        working-directory: website/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # Fresh runner and dependencies; no executable from the build job is reused.
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: validated-worker
          path: website/app/dist
      - name: Configure the new deployment
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
        run: node scripts/configure-cloudflare.mjs
      - name: Migrate the new database and deploy the validated bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure the Cloudflare API token first"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure the new Cloudflare account ID first"; exit 1; }
          bun node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --remote --config wrangler.deploy.jsonc
          bun node_modules/wrangler/bin/wrangler.js deploy --no-bundle --config wrangler.deploy.jsonc
