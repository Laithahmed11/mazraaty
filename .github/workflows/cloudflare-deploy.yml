name: Deploy independent Cloudflare Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-mazraati
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-new
    defaults:
      run:
        working-directory: website/app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
      FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
      PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Require new-account configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure the Cloudflare API token first"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure the new Cloudflare account ID first"; exit 1; }
          node scripts/configure-cloudflare.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:product
      - run: bun run build
      - run: bun run cf:configure
      - run: bun run cf:dry-run
      - run: bun run test:worker
      - run: bun run db:remote
      - run: bun run deploy
