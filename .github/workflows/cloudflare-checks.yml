name: Cloudflare application checks
on:
  push:
    paths: ['website/app/**', '.github/workflows/cloudflare-*.yml', '.github/workflows/private-backup.yml']
  pull_request:
    paths: ['website/app/**', '.github/workflows/cloudflare-*.yml', '.github/workflows/private-backup.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: node scripts/check-image-tooling.mjs
      - run: bun run audit:security
      - run: bun run typecheck
      - run: bun run test:product
      - run: bun run build
      - run: bun run db:local
      - run: bun run cf:dry-run
      - run: bun run test:worker
