name: Build Cloudflare Android customer APK
on:
  push:
    branches: ['codex/**', main]
    paths: ['android/**', '.github/workflows/android-customer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Firebase app configuration
        env:
          FIREBASE_APP_CONFIG: ${{ secrets.FIREBASE_CUSTOMER_JSON }}
        run: |
          if [ -n "$FIREBASE_APP_CONFIG" ]; then printf '%s' "$FIREBASE_APP_CONFIG" > android/customer/google-services.json; fi
      - name: Prepare Android 35 toolchain
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platforms;android-35'
      - name: Build and verify signed test APK
        run: bash android/customer/build.sh
      - name: Verify Cloudflare address in compiled APK
        run: |
          unzip -p android/customer/build/Mazraaty-Customer-test.apk 'classes*.dex' > /tmp/mazraaty-customer.dex
          strings /tmp/mazraaty-customer.dex > /tmp/mazraaty-customer-strings.txt
          grep -F 'mazraati-preview.laithlaith500.workers.dev' /tmp/mazraaty-customer-strings.txt
          grep -F 'BookingMessagingService' /tmp/mazraaty-customer-strings.txt
          if grep -F 'mazraaty-iraq.higgsfield.app' /tmp/mazraaty-customer-strings.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mazraaty-Customer-Cloudflare-test
          path: android/customer/build/Mazraaty-Customer-test.apk
          if-no-files-found: error
          retention-days: 14
